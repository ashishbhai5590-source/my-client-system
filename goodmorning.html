<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Good Morning Special</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      background: radial-gradient(circle at center, #260817 0%, #0d0107 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      color: #fff;
    }

    /* Background Patakhe Canvas */
    #fireworksCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* Common Card Styling */
    .card {
      position: absolute;
      z-index: 10;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 30px 24px;
      border-radius: 24px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 88%;
      max-width: 350px;
      transition: all 0.5s ease;
    }

    .hide {
      opacity: 0 !important;
      transform: scale(0.8) !important;
      pointer-events: none !important;
      display: none !important;
    }

    /* --- PAGE 1: Riddle / Paheli --- */
    .riddle-tag {
      font-size: 13px;
      letter-spacing: 2px;
      color: #ff8fa3;
      text-transform: uppercase;
      margin-bottom: 15px;
      font-weight: 600;
    }

    .poem-box {
      font-size: 16px;
      line-height: 1.8;
      color: #f7cad0;
      margin-bottom: 25px;
      font-style: italic;
    }

    .poem-line {
      opacity: 0;
      transform: translateY(10px);
      animation: fadeInUp 0.8s forwards;
    }

    .poem-line:nth-child(1) { animation-delay: 0.3s; }
    .poem-line:nth-child(2) { animation-delay: 0.8s; }
    .poem-line:nth-child(3) { animation-delay: 1.3s; }
    .poem-line:nth-child(4) { animation-delay: 1.8s; font-weight: 600; color: #fff; }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Buttons */
    .btn-action {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #ff2a5f, #ff758c);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(255, 42, 95, 0.4);
      transition: transform 0.1s;
    }

    .btn-action:active {
      transform: scale(0.96);
    }

    /* --- PAGE 2: Password Input --- */
    input[type="text"] {
      width: 100%;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.12);
      border: 1.5px solid rgba(255, 105, 135, 0.4);
      border-radius: 50px;
      outline: none;
      color: #fff;
      font-size: 17px;
      text-align: center;
      margin-top: 15px;
      margin-bottom: 15px;
    }

    input[type="text"]::placeholder {
      color: #ffccd5;
      font-size: 14px;
    }

    .error-msg {
      color: #ff4d6d;
      font-size: 13px;
      margin-top: 8px;
      min-height: 18px;
    }

    .shake {
      animation: shakeAnim 0.3s ease-in-out;
    }

    @keyframes shakeAnim {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    /* --- PAGE 3: Final Good Morning Screen --- */
    .surprise-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      z-index: 20;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 90%;
      opacity: 0;
      transition: all 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .surprise-box.show {
      display: flex;
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Heart Animation */
    .big-heart {
      position: relative;
      width: 85px;
      height: 75px;
      margin-bottom: 25px;
      animation: heartBeat 1.1s infinite;
      filter: drop-shadow(0 0 30px #ff1a53);
    }

    .big-heart::before,
    .big-heart::after {
      content: "";
      position: absolute;
      left: 42px;
      top: 0;
      width: 43px;
      height: 70px;
      background: linear-gradient(135deg, #ff1a53, #ff758c);
      border-radius: 45px 45px 0 0;
      transform: rotate(-45deg);
      transform-origin: 0 100%;
    }

    .big-heart::after {
      left: 0;
      transform: rotate(45deg);
      transform-origin: 100% 100%;
    }

    @keyframes heartBeat {
      0% { transform: scale(1); }
      15% { transform: scale(1.25); }
      30% { transform: scale(1); }
      45% { transform: scale(1.15); }
      60% { transform: scale(1); }
    }

    .gm-title {
      font-family: 'Dancing Script', cursive;
      font-size: 56px;
      color: #fff;
      text-shadow: 0 0 20px #ff2a5f, 0 0 45px #ff758c;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <!-- Fireworks Canvas -->
  <canvas id="fireworksCanvas"></canvas>

  <!-- PAGE 1: Riddle Shayari Screen -->
  <div class="card" id="page1">
    <div class="riddle-tag">Pehli Paheli 💭</div>
    <div class="poem-box">
      <div class="poem-line">"Andhera jisse darr kar bhaage,</div>
      <div class="poem-line">Har koi jiske aane par jaage...</div>
      <div class="poem-line">Bina aawaz ke jo aati hai,</div>
      <div class="poem-line">Batao wo kya kehlaati hai?"</div>
    </div>
    <button class="btn-action" onclick="goToPasswordPage()">Mil Gaya 💡</button>
  </div>

  <!-- PAGE 2: Password Screen -->
  <div class="card hide" id="page2">
    <div class="riddle-tag">Jawaab Enter Karein 🔐</div>
    <input type="text" id="passwordInput" placeholder="Yahan likhein..." autocomplete="off" />
    <button class="btn-action" onclick="verifyPassword()">Open</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <!-- PAGE 3: Final Good Morning Screen (No Shayari) -->
  <div class="surprise-box" id="page3">
    <div class="big-heart"></div>
    <h1 class="gm-title">Good Morning ❤️</h1>
  </div>

  <script>
    // --- 1. Navigation Flow ---
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');
    const page3 = document.getElementById('page3');
    const passwordInput = document.getElementById('passwordInput');
    const errorMsg = document.getElementById('errorMsg');

    function goToPasswordPage() {
      page1.classList.add('hide');
      setTimeout(() => {
        page2.classList.remove('hide');
        passwordInput.focus();
      }, 300);
    }

    passwordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') verifyPassword();
    });

    // Valid answers for the riddle
    const validAnswers = ["subah", "savera", "roshni"];

    function verifyPassword() {
      const userAns = passwordInput.value.trim().toLowerCase();

      if (validAnswers.includes(userAns)) {
        errorMsg.innerText = "";
        page2.classList.add('hide');

        // Start Sound and Fireworks immediately
        initAudio();
        startFireworks();

        // Show Good Morning screen
        setTimeout(() => {
          page3.classList.add('show');
        }, 300);

      } else {
        errorMsg.innerText = "Galat jawaab! Paheli dobara socho 💭";
        page2.classList.add('shake');
        setTimeout(() => page2.classList.remove('shake'), 350);
      }
    }

    // --- 2. Real Sound Engine (Web Audio API - Offline Patakha Pop) ---
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playCrackerSound() {
      if (!audioCtx) return;
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      // Generate burst noise
      const bufferSize = audioCtx.sampleRate * 0.35;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      // Lowpass filter for deep boom sound
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(900, audioCtx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.3);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);

      noise.start();
    }

    // --- 3. Crackers Animation (Canvas) ---
    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let particles = [];
    const colors = ['#ff0055', '#ff5079', '#ffcc00', '#00e5ff', '#ffffff', '#ff9900'];

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * 2.5 + 1.5;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.decay = Math.random() * 0.02 + 0.015;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.09;
        this.alpha -= this.decay;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.restore();
      }
    }

    function blastCracker(x, y) {
      playCrackerSound(); // Sound plays on every cracker burst
      const color = colors[Math.floor(Math.random() * colors.length)];
      for (let i = 0; i < 45; i++) {
        particles.push(new Particle(x, y, color));
      }
    }

    function startFireworks() {
      // First bursts
      blastCracker(canvas.width * 0.3, canvas.height * 0.35);
      setTimeout(() => blastCracker(canvas.width * 0.7, canvas.height * 0.35), 200);
      setTimeout(() => blastCracker(canvas.width * 0.5, canvas.height * 0.25), 450);

      // Continuous crackers popping
      setInterval(() => {
        const rx = Math.random() * (canvas.width * 0.8) + (canvas.width * 0.1);
        const ry = Math.random() * (canvas.height * 0.45) + (canvas.height * 0.1);
        blastCracker(rx, ry);
      }, 550);

      function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = particles.length - 1; i >= 0; i--) {
          particles[i].update();
          particles[i].draw();
          if (particles[i].alpha <= 0) {
            particles.splice(i, 1);
          }
        }
        requestAnimationFrame(loop);
      }
      loop();
    }
  </script>
</body>
</html>
