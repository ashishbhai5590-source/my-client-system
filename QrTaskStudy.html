<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syllabus Auto-Pilot (PCB)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f1f5f9; overflow-x: hidden; }
        .glass-card { background: #ffffff; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); border-radius: 1rem; border: 1px solid #e2e8f0; }
        #reader { border: none !important; border-radius: 1rem; overflow: hidden; background: #000; width: 100%; min-height: 250px; }
        #reader video { object-fit: cover !important; }
        
        /* Checkbox Custom Styling */
        .task-btn { transition: all 0.2s ease-in-out; }
        .task-btn.active { background-color: #22c55e; color: white; border-color: #16a34a; transform: scale(1.02); }
        .task-btn.active i { display: inline-block; }
        .task-btn i { display: none; }

        /* Animations */
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes slideOutLeft { 0% { transform: translateX(0); opacity: 1; } 100% { transform: translateX(-100%); opacity: 0; } }
        @keyframes slideInRight { 0% { transform: translateX(100%); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
        
        .animate-pop { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .slide-out { animation: slideOutLeft 0.4s forwards; }
        .slide-in { animation: slideInRight 0.4s forwards; }
    </style>
</head>
<body class="text-gray-800 p-4 md:p-8 relative">

    <div class="max-w-6xl mx-auto" id="main-content">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 glass-card p-6 border-t-4 border-indigo-600">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-800"><i class="fa-solid fa-bolt text-indigo-600 mr-2"></i>Flashcard Auto-Pilot</h1>
                <p class="text-gray-500 font-medium mt-1">Physics, Chemistry, Biology - Smart Progression</p>
            </div>
            <div class="mt-4 md:mt-0 text-sm font-bold text-green-600 bg-green-50 px-4 py-2 rounded-lg border border-green-200">
                <i class="fa-solid fa-database mr-1"></i> Syllabus Pre-loaded
            </div>
        </div>

        <!-- 1. DIRECT SCANNER SECTION -->
        <div class="glass-card p-6 relative mb-8">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-700"><i class="fa-solid fa-camera mr-2 text-indigo-500"></i>Scanning For Any Barcode...</h2>
            </div>
            <div class="relative rounded-xl overflow-hidden shadow-inner border-4 border-gray-100 bg-black min-h-[250px] flex items-center justify-center">
                <!-- Camera will directly open here -->
                <div id="reader" class="w-full"></div>
            </div>
            <p class="text-center text-xs text-gray-400 mt-3 font-bold">
                <i class="fa-solid fa-bolt text-yellow-500"></i> HD Mode Active: Just point at the lines!
            </p>
        </div>

        <!-- 2. OVERVIEW CHART (BOTTOM) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <!-- Physics -->
            <div class="glass-card p-5 border-l-4 border-indigo-500 shadow-sm relative overflow-hidden">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-bold text-indigo-700"><i class="fa-solid fa-atom mr-2"></i>Physics</h3>
                    <span id="phy-percent" class="font-extrabold text-indigo-600 text-2xl">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-3 mb-2"><div id="phy-bar" class="bg-indigo-500 h-3 rounded-full transition-all duration-700" style="width: 0%"></div></div>
                <p id="phy-text" class="text-xs font-bold text-gray-500 text-right">0 / 7 Done</p>
            </div>
            <!-- Chemistry -->
            <div class="glass-card p-5 border-l-4 border-rose-500 shadow-sm relative overflow-hidden">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-bold text-rose-700"><i class="fa-solid fa-flask mr-2"></i>Chemistry</h3>
                    <span id="che-percent" class="font-extrabold text-rose-600 text-2xl">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-3 mb-2"><div id="che-bar" class="bg-rose-500 h-3 rounded-full transition-all duration-700" style="width: 0%"></div></div>
                <p id="che-text" class="text-xs font-bold text-gray-500 text-right">0 / 10 Done</p>
            </div>
            <!-- Biology -->
            <div class="glass-card p-5 border-l-4 border-emerald-500 shadow-sm relative overflow-hidden">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-bold text-emerald-700"><i class="fa-solid fa-dna mr-2"></i>Biology</h3>
                    <span id="bio-percent" class="font-extrabold text-emerald-600 text-2xl">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-3 mb-2"><div id="bio-bar" class="bg-emerald-500 h-3 rounded-full transition-all duration-700" style="width: 0%"></div></div>
                <p id="bio-text" class="text-xs font-bold text-gray-500 text-right">0 / 13 Done</p>
            </div>
        </div>
    </div>

    <!-- 🔥 SUPER FLASHCARD MODAL (POPS UP ON SCAN) 🔥 -->
    <div id="flashcard-modal" class="fixed inset-0 bg-gray-900 bg-opacity-95 flex items-center justify-center hidden z-50 p-2 md:p-4 backdrop-blur-sm overflow-y-auto">
        <div class="w-full max-w-6xl w-full min-h-screen md:min-h-0 flex flex-col pt-10 pb-10 md:pt-0 md:pb-0 justify-center relative">
            
            <div class="flex justify-between items-center mb-6 px-4">
                <h2 class="text-3xl font-black text-white tracking-wider"><i class="fa-solid fa-layer-group text-indigo-400 mr-2"></i>Active Chapters</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white text-4xl transition-colors"><i class="fa-solid fa-circle-xmark"></i></button>
            </div>

            <!-- The 3 Cards Container -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 px-4" id="cards-container">
                <!-- Physics Card Space -->
                <div id="wrapper-Physics" class="relative overflow-hidden rounded-2xl"></div>
                <!-- Chemistry Card Space -->
                <div id="wrapper-Chemistry" class="relative overflow-hidden rounded-2xl"></div>
                <!-- Biology Card Space -->
                <div id="wrapper-Biology" class="relative overflow-hidden rounded-2xl"></div>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            
            const defaultDB = {
                Physics: [
                    { id: 'p1', name: '1. वैद्युत आवेश तथा क्षेत्र', status: 'pending', task1: false, task2: false },
                    { id: 'p2', name: '2. वैद्युत फ्लक्स तथा गॉस की प्रमेय', status: 'pending', task1: false, task2: false },
                    { id: 'p3', name: '3. वैद्युत विभव', status: 'pending', task1: false, task2: false },
                    { id: 'p4', name: '4. संधारित्र तथा परावैद्युतांक', status: 'pending', task1: false, task2: false },
                    { id: 'p5', name: '5. वैद्युत चालन', status: 'pending', task1: false, task2: false },
                    { id: 'p6', name: '6. किरचॉफ का नियम तथा वैद्युत परिपथ', status: 'pending', task1: false, task2: false },
                    { id: 'p7', name: '7. गतिमान वस्तु तथा चुंबकीय क्षेत्र', status: 'pending', task1: false, task2: false }
                ],
                Chemistry: [
                    { id: 'c1', name: '1. विलयन (Solution)', status: 'pending', task1: false, task2: false },
                    { id: 'c2', name: '2. वैद्युत रसायन', status: 'pending', task1: false, task2: false },
                    { id: 'c3', name: '3. रासायनिक बलगतिकी', status: 'pending', task1: false, task2: false },
                    { id: 'c4', name: '4. d- एवं f- ब्लॉक के तत्व', status: 'pending', task1: false, task2: false },
                    { id: 'c5', name: '5. उपसहसंयोजक यौगिक', status: 'pending', task1: false, task2: false },
                    { id: 'c6', name: '6. हैलो ऐल्केन एवं हैलोऐरीन', status: 'pending', task1: false, task2: false },
                    { id: 'c7', name: '7. एल्कोहॉल, फिनॉल एवं ईथर', status: 'pending', task1: false, task2: false },
                    { id: 'c8', name: '8. एल्डिहाइड, कीटोन एवं कार्बोक्सिलिक अम्ल', status: 'pending', task1: false, task2: false },
                    { id: 'c9', name: '9. नाइट्रोजन युक्त कार्बनिक यौगिक', status: 'pending', task1: false, task2: false },
                    { id: 'c10', name: '10. जैविक अणु', status: 'pending', task1: false, task2: false }
                ],
                Biology: [
                    { id: 'b1', name: '1. Sexual Reproduction in Flowering Plant', status: 'pending', task1: false, task2: false },
                    { id: 'b2', name: '2. Human Reproduction', status: 'pending', task1: false, task2: false },
                    { id: 'b3', name: '3. Reproductive Health', status: 'pending', task1: false, task2: false },
                    { id: 'b4', name: '4. Principles of Inheritance and Variation', status: 'pending', task1: false, task2: false },
                    { id: 'b5', name: '5. Molecular Basis of Inheritance', status: 'pending', task1: false, task2: false },
                    { id: 'b6', name: '6. Evolution', status: 'pending', task1: false, task2: false },
                    { id: 'b7', name: '7. Human Health and Disease', status: 'pending', task1: false, task2: false },
                    { id: 'b8', name: '8. Microbes in Human Welfare', status: 'pending', task1: false, task2: false },
                    { id: 'b9', name: '9. Biotechnology: Principles and Processes', status: 'pending', task1: false, task2: false },
                    { id: 'b10', name: '10. Biotechnology and its Applications', status: 'pending', task1: false, task2: false },
                    { id: 'b11', name: '11. Organisms and Populations', status: 'pending', task1: false, task2: false },
                    { id: 'b12', name: '12. Ecosystem', status: 'pending', task1: false, task2: false },
                    { id: 'b13', name: '13. Biodiversity and Conservation', status: 'pending', task1: false, task2: false }
                ]
            };

            let db = JSON.parse(localStorage.getItem('PreloadedSyllabusDB_V2'));
            if(!db) {
                db = defaultDB;
                localStorage.setItem('PreloadedSyllabusDB_V2', JSON.stringify(db));
            }

            let html5QrCode = null;
            let audioCtx = null;

            // --- AUDIO SYSTEM ---
            function initAudio() {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
            }

            // Silent audio unlock trick
            document.body.addEventListener('touchstart', initAudio, { once: true });
            document.body.addEventListener('click', initAudio, { once: true });

            function playSound(type) {
                initAudio();
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                if(type === 'scan') {
                    osc.type = "sine"; osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.15);
                } else if(type === 'click') {
                    osc.type = "square"; osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
                    osc.stop(audioCtx.currentTime + 0.05);
                } else if(type === 'success') {
                    osc.type = "triangle"; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.2);
                    osc.stop(audioCtx.currentTime + 0.2);
                } else if(type === 'drop') {
                    osc.type = "sine"; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.2);
                    osc.stop(audioCtx.currentTime + 0.2);
                }
                
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start();
            }

            // --- AUTO START SCANNER (HEAVY DUTY FOR 1D BARCODES) ---
            function startDirectCamera() {
                html5QrCode = new Html5Qrcode("reader");
                
                const config = { 
                    fps: 30, // MAX Scanning speed
                    disableFlip: false
                };

                // YAHAN PE HAI MAIN MAGIC - Forcing HD Resolution & Focus
                const cameraConstraints = {
                    facingMode: "environment", // Back camera
                    width: { ideal: 1920 },    // Full HD width
                    height: { ideal: 1080 },   // Full HD height
                    advanced: [{ focusMode: "continuous" }] // Auto-focus zaroori hai
                };

                html5QrCode.start(
                    cameraConstraints,
                    config,
                    onScanSuccess, 
                    function(errorMessage) {
                        // Background me searching chalne do
                    }
                ).catch(err => {
                    console.error("Camera access failed", err);
                    alert("Camera Error: Please Allow Camera Permissions.");
                });
            }

            // Page load hote hi camera start
            startDirectCamera();

            // --- PROGRESS OVERVIEW ---
            function updateOverview() {
                const subjects = ['Physics', 'Chemistry', 'Biology'];
                const prefixes = { 'Physics': 'phy', 'Chemistry': 'che', 'Biology': 'bio' };

                subjects.forEach(sub => {
                    const total = db[sub].length;
                    const completed = db[sub].filter(c => c.status === 'completed').length;
                    const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

                    document.getElementById(`${prefixes[sub]}-percent`).innerText = `${percent}%`;
                    document.getElementById(`${prefixes[sub]}-bar`).style.width = `${percent}%`;
                    document.getElementById(`${prefixes[sub]}-text`).innerText = `${completed} / ${total} Done`;
                });
            }

            // --- SCAN SUCCESS TRIGGER ---
            function onScanSuccess(decodedText) {
                if(!document.getElementById('flashcard-modal').classList.contains('hidden')) return; 
                
                playSound('scan');
                if(html5QrCode) html5QrCode.pause(true); 

                document.getElementById('flashcard-modal').classList.remove('hidden');
                renderAllFlashcards();
            }

            window.closeModal = function() {
                document.getElementById('flashcard-modal').classList.add('hidden');
                if(html5QrCode) html5QrCode.resume(); 
                updateOverview();
            }

            // --- FLASHCARD LOGIC ---
            function renderAllFlashcards() {
                renderCard('Physics');
                renderCard('Chemistry');
                renderCard('Biology');
            }

            function renderCard(subject, animationClass = 'animate-pop') {
                const wrapper = document.getElementById(`wrapper-${subject}`);
                const chapter = db[subject].find(c => c.status === 'pending');

                let theme = {};
                if(subject === 'Physics') theme = { bg: 'bg-indigo-600', lightBg: 'bg-indigo-50', text: 'text-indigo-700', icon: 'fa-atom', border: 'border-indigo-200', btn: 'bg-indigo-100 hover:bg-indigo-200 border-indigo-300 text-indigo-700', task1Name: 'Theory', task2Name: 'Numerical' };
                if(subject === 'Chemistry') theme = { bg: 'bg-rose-600', lightBg: 'bg-rose-50', text: 'text-rose-700', icon: 'fa-flask', border: 'border-rose-200', btn: 'bg-rose-100 hover:bg-rose-200 border-rose-300 text-rose-700', task1Name: 'Theory', task2Name: 'Numerical' };
                if(subject === 'Biology') theme = { bg: 'bg-emerald-600', lightBg: 'bg-emerald-50', text: 'text-emerald-700', icon: 'fa-dna', border: 'border-emerald-200', btn: 'bg-emerald-100 hover:bg-emerald-200 border-emerald-300 text-emerald-700', task1Name: 'Theory Notes', task2Name: 'NCERT' };

                wrapper.className = `relative overflow-hidden rounded-3xl bg-white border-2 ${theme.border} shadow-xl flex flex-col h-full ${animationClass}`;

                if(!chapter) {
                    wrapper.innerHTML = `
                        <div class="flex-1 flex flex-col items-center justify-center p-10 text-center ${theme.lightBg}">
                            <i class="fa-solid fa-trophy text-6xl text-yellow-500 mb-4 animate-bounce"></i>
                            <h2 class="text-2xl font-black ${theme.text}">${subject} Complete!</h2>
                            <p class="text-gray-500 font-bold mt-2">All chapters finished.</p>
                        </div>`;
                    return;
                }

                wrapper.innerHTML = `
                    <div class="${theme.bg} text-white p-4 text-center relative shadow-md">
                        <span class="absolute top-3 left-4 opacity-20 text-4xl"><i class="fa-solid ${theme.icon}"></i></span>
                        <h3 class="text-sm font-black uppercase tracking-widest relative z-10">${subject}</h3>
                    </div>
                    
                    <div class="p-6 text-center flex-1 flex flex-col justify-center border-b border-gray-100 min-h-[150px]">
                        <p class="text-gray-400 font-bold text-[10px] mb-2 uppercase tracking-widest">Current Focus</p>
                        <h2 class="text-2xl font-extrabold text-gray-800 leading-tight">${chapter.name}</h2>
                    </div>
                    
                    <div class="p-4 ${theme.lightBg} flex flex-col gap-3">
                        <button onclick="toggleTask('${subject}', '${chapter.id}', 'task1')" class="task-btn w-full p-4 rounded-xl border-2 font-bold text-lg text-left flex justify-between items-center ${chapter.task1 ? 'active' : theme.btn}">
                            <span>${theme.task1Name}</span>
                            <i class="fa-solid fa-circle-check text-xl"></i>
                        </button>
                        
                        <button onclick="toggleTask('${subject}', '${chapter.id}', 'task2')" class="task-btn w-full p-4 rounded-xl border-2 font-bold text-lg text-left flex justify-between items-center ${chapter.task2 ? 'active' : theme.btn}">
                            <span>${theme.task2Name}</span>
                            <i class="fa-solid fa-circle-check text-xl"></i>
                        </button>
                    </div>

                    <div class="p-3 bg-white border-t border-gray-100">
                        <button onclick="dropChapter('${subject}', '${chapter.id}')" class="w-full py-3 text-gray-400 hover:text-gray-700 hover:bg-gray-100 rounded-lg font-bold transition-all text-sm uppercase tracking-wider">
                            <i class="fa-solid fa-angles-down mr-1"></i> Drop (Do Later)
                        </button>
                    </div>
                `;
            }

            // --- TASK TOGGLE LOGIC ---
            window.toggleTask = function(subject, chapterId, taskKey) {
                playSound('click');
                const chapter = db[subject].find(c => c.id === chapterId);
                if(chapter) {
                    chapter[taskKey] = !chapter[taskKey];
                    localStorage.setItem('PreloadedSyllabusDB_V2', JSON.stringify(db));
                    
                    renderCard(subject, '');

                    if(chapter.task1 && chapter.task2) {
                        setTimeout(() => completeChapter(subject, chapterId), 300);
                    }
                }
            }

            // --- COMPLETE LOGIC ---
            function completeChapter(subject, chapterId) {
                playSound('success');
                const chapter = db[subject].find(c => c.id === chapterId);
                chapter.status = 'completed';
                localStorage.setItem('PreloadedSyllabusDB_V2', JSON.stringify(db));
                updateOverview();

                const wrapper = document.getElementById(`wrapper-${subject}`);
                wrapper.classList.add('slide-out');

                setTimeout(() => {
                    renderCard(subject, 'slide-in');
                }, 400);
            }

            // --- DROP LOGIC ---
            window.dropChapter = function(subject, chapterId) {
                playSound('drop');
                const index = db[subject].findIndex(c => c.id === chapterId);
                if(index > -1) {
                    const chapter = db[subject].splice(index, 1)[0];
                    chapter.task1 = false; chapter.task2 = false; 
                    db[subject].push(chapter);
                    localStorage.setItem('PreloadedSyllabusDB_V2', JSON.stringify(db));
                }

                const wrapper = document.getElementById(`wrapper-${subject}`);
                wrapper.classList.add('slide-out');
                setTimeout(() => {
                    renderCard(subject, 'slide-in');
                }, 400);
            }

            updateOverview();
        });
    </script>
</body>
</html>
