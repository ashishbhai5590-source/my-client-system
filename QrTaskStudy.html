<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Study & Activity Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .glass-card { background: rgba(255, 255, 255, 0.95); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); border-radius: 1rem; }
        .calendar-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 0.5rem; border: 1px solid #e5e7eb; transition: all 0.2s; }
        #reader { border: none !important; border-radius: 1rem; overflow: hidden; background: #000; width: 100%; min-height: 250px; }
        #reader__dashboard_section_csr button { background-color: #4f46e5; color: white; padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; margin-top: 10px;}
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    </style>
</head>
<body class="text-gray-800 p-4 md:p-8 relative">

    <div class="max-w-6xl mx-auto" id="main-content">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 glass-card p-6 border-t-4 border-indigo-500">
            <div class="mb-4 md:mb-0 text-center md:text-left">
                <h1 class="text-3xl font-bold text-indigo-700"><i class="fa-solid fa-crosshairs mr-2"></i>Ultimate Tracker</h1>
                <p class="text-gray-500 mt-1">Smart Memory & Auto Save System</p>
            </div>
            <button onclick="downloadPDF()" class="bg-red-500 hover:bg-red-600 text-white px-6 py-2 rounded-lg shadow-lg font-semibold w-full md:w-auto transition-all">
                <i class="fa-solid fa-file-pdf mr-2"></i> Report PDF Download
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Left Panel -->
            <div class="space-y-6 md:col-span-1">
                <div class="glass-card p-6">
                    <h2 class="text-xl font-bold mb-4 text-gray-700"><i class="fa-solid fa-chart-pie mr-2 text-indigo-500"></i>Monthly Status</h2>
                    <div class="grid grid-cols-2 gap-4 text-center">
                        <div class="bg-green-50 p-4 rounded-xl border border-green-200 shadow-sm">
                            <h3 class="text-green-600 font-bold text-3xl" id="days-utilized">0</h3>
                            <p class="text-sm text-green-800 font-medium">Din Aabad ✅</p>
                        </div>
                        <div class="bg-red-50 p-4 rounded-xl border border-red-200 shadow-sm">
                            <h3 class="text-red-600 font-bold text-3xl" id="days-wasted">0</h3>
                            <p class="text-sm text-red-800 font-medium">Din Barbad ❌</p>
                        </div>
                    </div>
                </div>

                <!-- Scanner -->
                <div class="glass-card p-6 relative">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold text-gray-700"><i class="fa-solid fa-camera mr-2 text-indigo-500"></i>Scanner</h2>
                    </div>
                    
                    <div id="reader" class="w-full rounded-xl border-4 border-gray-100"></div>
                    
                    <!-- Cooldown Rest Screen -->
                    <div id="cooldown-overlay" class="absolute inset-0 bg-white bg-opacity-95 hidden flex-col items-center justify-center rounded-xl z-10 m-6 shadow-inner">
                        <i class="fa-solid fa-check-circle text-5xl text-green-500 mb-3 animate-pulse"></i>
                        <h3 class="font-bold text-gray-700 text-lg">Saved Successfully!</h3>
                        <p class="text-sm text-gray-500 font-medium mt-1">Ready for next scan...</p>
                    </div>

                    <!-- Scan Result Status Box -->
                    <div id="scan-status" class="hidden mt-4 text-center font-bold p-4 rounded-xl border-2 shadow-md"></div>
                </div>
            </div>

            <!-- Right Panel -->
            <div class="space-y-6 md:col-span-2">
                <!-- Calendar -->
                <div class="glass-card p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold text-gray-700"><i class="fa-regular fa-calendar-check mr-2 text-indigo-500"></i>Study Calendar</h2>
                        <span id="month-name" class="font-bold text-indigo-700 bg-indigo-50 px-4 py-1 rounded-full border border-indigo-100"></span>
                    </div>
                    <div class="grid grid-cols-7 gap-2 text-center text-sm font-bold text-gray-400 mb-2 uppercase tracking-wider">
                        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                    </div>
                    <div id="calendar-grid" class="grid grid-cols-7 gap-2"></div>
                </div>

                <!-- Timeline -->
                <div class="glass-card p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold text-gray-700"><i class="fa-solid fa-list-check mr-2 text-indigo-500"></i>Activity Log</h2>
                        <button onclick="clearLogs()" class="text-sm font-semibold text-gray-400 hover:text-red-500 transition-colors"><i class="fa-solid fa-trash mr-1"></i>Clear Data</button>
                    </div>
                    <div class="h-80 overflow-y-auto pr-2 space-y-3" id="activity-logs"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MAGIC MODAL (NEW BARCODE LIST) -->
    <div id="mapping-modal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center hidden z-50 p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl transform transition-all animate-pop">
            <h2 class="text-2xl font-bold text-indigo-700 mb-2"><i class="fa-solid fa-microchip mr-2"></i>Naya Barcode Mila!</h2>
            <p class="text-gray-600 mb-6 text-sm font-medium bg-gray-50 p-3 rounded-lg border">Isko ek baar set kardo, system isko hamesha ke liye yaad rakhega.</p>
            <div class="grid grid-cols-1 gap-3 mb-4" id="action-buttons"></div>
            <div class="text-center">
                <button onclick="closeMappingModal()" class="text-red-500 text-sm font-bold hover:underline p-2">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            
            // Database (Naya naam taaki purani galti na aaye)
            let appData;
            try {
                appData = JSON.parse(localStorage.getItem('smartTrackerDataFINAL3'));
                if(!appData || !appData.barcodeMap) throw new Error("No data");
            } catch (e) {
                appData = { calendar: {}, logs: [], barcodeMap: {} };
            }

            const today = new Date();
            const currentDateStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
            
            let tempBarcode = "";
            let html5QrcodeScanner = null;
            let audioCtx = null; 
            let isProcessingScan = false; // YAHI HAI WO SUPER LOCK 🔒

            const qrActions = {
                "STUDY_YES": { msg: "Study Completed ✅", type: "study", icon: "fa-book-open", bg: "bg-green-100 text-green-700 border-green-400" },
                "STUDY_NO": { msg: "Study Missed (Din Barbad) ❌", type: "nostudy", icon: "fa-book-skull", bg: "bg-red-100 text-red-700 border-red-400" },
                "ROOM_ENTRY": { msg: "Room Mein Entry Ki", type: "entry", icon: "fa-door-open", bg: "bg-blue-100 text-blue-700 border-blue-400" },
                "ROOM_EXIT": { msg: "Room Se Bahar Nikla", type: "exit", icon: "fa-person-walking-arrow-right", bg: "bg-gray-200 text-gray-700 border-gray-400" },
                "HOME": { msg: "Ghar Gaya (Chhutti!) 🏡", type: "home", icon: "fa-house-chimney-window", bg: "bg-purple-100 text-purple-700 border-purple-400" }
            };

            // Audio Setup
            function initAudio() {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }
            document.addEventListener('click', initAudio, { once: true });
            document.addEventListener('touchstart', initAudio, { once: true });

            window.playBeep = function(isError = false) {
                try {
                    initAudio();
                    if (!audioCtx) return;
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    
                    osc.type = isError ? "square" : "sine";
                    osc.frequency.setValueAtTime(isError ? 300 : 900, audioCtx.currentTime);
                    if(isError) osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.3);
                    
                    gain.gain.setValueAtTime(0.5, audioCtx.currentTime); 
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start();
                    osc.stop(audioCtx.currentTime + (isError ? 0.3 : 0.15));
                } catch(e) {}
            };

            // UI Render Functions
            window.renderCalendar = function() {
                const grid = document.getElementById('calendar-grid');
                grid.innerHTML = '';
                const year = today.getFullYear();
                const month = today.getMonth();
                const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
                document.getElementById('month-name').innerText = `${monthNames[month]} ${year}`;

                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                let utilized = 0, wasted = 0;

                for (let i = 0; i < firstDay; i++) grid.innerHTML += `<div class="calendar-day border-none"></div>`;

                for (let i = 1; i <= daysInMonth; i++) {
                    let dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                    let status = appData.calendar[dateStr];
                    let content = `<span class="text-sm font-semibold text-gray-400">${i}</span>`;
                    let bgClass = "bg-white";

                    if (status === 'yes') { content += `<i class="fa-solid fa-check text-green-500 mt-1 text-2xl"></i>`; bgClass = "bg-green-50 border-green-200 shadow-sm"; utilized++; }
                    else if (status === 'no') { content += `<i class="fa-solid fa-xmark text-red-500 mt-1 text-2xl"></i>`; bgClass = "bg-red-50 border-red-200 shadow-sm"; wasted++; }
                    if(dateStr === currentDateStr) bgClass += " ring-2 ring-indigo-500 shadow-md";

                    grid.innerHTML += `<div class="calendar-day ${bgClass}">${content}</div>`;
                }
                document.getElementById('days-utilized').innerText = utilized;
                document.getElementById('days-wasted').innerText = wasted;
            };

            window.renderLogs = function() {
                const logsContainer = document.getElementById('activity-logs');
                logsContainer.innerHTML = '';
                if (appData.logs.length === 0) {
                    logsContainer.innerHTML = `<div class="text-center text-gray-400 py-10"><i class="fa-solid fa-barcode text-4xl mb-3 block"></i>No activities yet.</div>`;
                    return;
                }
                [...appData.logs].reverse().forEach(log => {
                    const actionData = qrActions[log.type];
                    logsContainer.innerHTML += `
                        <div class="flex items-center p-3 bg-white rounded-lg border border-gray-100 shadow-sm mb-3">
                            <div class="h-10 w-10 rounded-full bg-gray-50 flex items-center justify-center mr-4 border border-gray-200">
                                <i class="fa-solid ${actionData.icon} text-lg ${actionData.bg.split(' ')[1]}"></i>
                            </div>
                            <div class="flex-1">
                                <h4 class="font-bold text-gray-800">${actionData.msg}</h4>
                                <p class="text-xs text-gray-400 font-medium"><i class="fa-regular fa-clock mr-1"></i>${log.time}</p>
                            </div>
                        </div>`;
                });
            };

            function isDuplicateStudy(actionKey) {
                return (actionKey === "STUDY_YES" || actionKey === "STUDY_NO") && appData.calendar[currentDateStr];
            }

            function showErrorBox() {
                const statusDiv = document.getElementById('scan-status');
                statusDiv.classList.remove('hidden');
                statusDiv.className = `mt-4 text-center text-lg font-bold p-4 rounded-xl border-2 shadow-md animate-pop block bg-red-100 text-red-800 border-red-500`;
                statusDiv.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-2 text-xl"></i> Aaj ka Padhai Status pehle hi lag chuka hai!`;
                setTimeout(() => { statusDiv.classList.add('hidden'); statusDiv.classList.remove('block'); }, 4000);
                applyScannerCooldown(3000);
            }

            function executeAction(actionKey) {
                const actionData = qrActions[actionKey];
                const statusDiv = document.getElementById('scan-status');

                if (actionKey === "STUDY_YES") appData.calendar[currentDateStr] = "yes";
                if (actionKey === "STUDY_NO") appData.calendar[currentDateStr] = "no";
                
                statusDiv.classList.remove('hidden');
                statusDiv.className = `mt-4 text-center text-lg font-bold p-4 rounded-xl border-2 shadow-md animate-pop block ${actionData.bg}`;
                statusDiv.innerHTML = `<i class="fa-solid ${actionData.icon} mr-2 text-xl"></i> ${actionData.msg} Saved!`;
                setTimeout(() => { statusDiv.classList.add('hidden'); statusDiv.classList.remove('block'); }, 4000);

                const timeString = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                appData.logs.push({ type: actionKey, action: actionData.msg, time: timeString, date: currentDateStr });
                
                localStorage.setItem('smartTrackerDataFINAL3', JSON.stringify(appData));
                renderCalendar();
                renderLogs();
                applyScannerCooldown(3000);
            }

            // --- SCANNER EVENT (SUPER LOCKED) ---
            function onScanSuccess(decodedText) {
                // Agar process chalu hai, toh doosre scan ko totally ignore karega
                if (isProcessingScan) return;
                isProcessingScan = true; // SYSTEM LOCK LAGA DIYA

                let actionKey = null;

                // Memory Check (Kya pehle se save hai?)
                if (appData.barcodeMap && appData.barcodeMap[decodedText]) {
                    actionKey = appData.barcodeMap[decodedText];
                } else if (qrActions[decodedText]) {
                    actionKey = decodedText;
                }

                if (actionKey) {
                    // PURANA BARCODE (Memory mein mila)
                    if (isDuplicateStudy(actionKey)) {
                        playBeep(true); 
                        showErrorBox();
                    } else {
                        playBeep(false); 
                        executeAction(actionKey); 
                    }
                } else {
                    // NAYA BARCODE (Pehli Baar)
                    playBeep(false); // SCAN HOTE HI AWAZ AAYEGI!
                    tempBarcode = decodedText;
                    openMappingModal(); // SIRF EK BAAR LIST KHULEGI
                }
            }

            // Modal Logic
            window.openMappingModal = function() {
                if(html5QrcodeScanner && html5QrcodeScanner.getState() === 2) html5QrcodeScanner.pause(); 
                const modal = document.getElementById('mapping-modal');
                const btnContainer = document.getElementById('action-buttons');
                btnContainer.innerHTML = '';

                Object.keys(qrActions).forEach(key => {
                    const act = qrActions[key];
                    btnContainer.innerHTML += `
                        <button onclick="saveMapping('${key}')" class="p-3 text-left rounded-xl border-2 shadow-sm transition-all ${act.bg} flex items-center hover:scale-105">
                            <i class="fa-solid ${act.icon} text-xl mr-3 w-6 text-center"></i>
                            <span class="text-sm font-bold">${act.msg}</span>
                        </button>`;
                });
                modal.classList.remove('hidden');
            };

            window.saveMapping = function(actionKey) {
                // Hamesha ke liye Memory mein Save
                if (!appData.barcodeMap) appData.barcodeMap = {};
                appData.barcodeMap[tempBarcode] = actionKey;
                localStorage.setItem('smartTrackerDataFINAL3', JSON.stringify(appData));
                
                document.getElementById('mapping-modal').classList.add('hidden');
                
                if (isDuplicateStudy(actionKey)) {
                    playBeep(true); 
                    showErrorBox();
                } else {
                    executeAction(actionKey); 
                }
            };

            window.closeMappingModal = function() {
                document.getElementById('mapping-modal').classList.add('hidden');
                if(html5QrcodeScanner && html5QrcodeScanner.getState() === 3) html5QrcodeScanner.resume();
                setTimeout(() => { isProcessingScan = false; }, 500); // UNLOCK
            };

            window.applyScannerCooldown = function(ms) {
                if(html5QrcodeScanner && html5QrcodeScanner.getState() === 2) html5QrcodeScanner.pause(true);
                document.getElementById('cooldown-overlay').classList.remove('hidden');
                document.getElementById('cooldown-overlay').classList.add('flex');

                setTimeout(() => {
                    document.getElementById('cooldown-overlay').classList.add('hidden');
                    document.getElementById('cooldown-overlay').classList.remove('flex');
                    if(html5QrcodeScanner && html5QrcodeScanner.getState() === 3) html5QrcodeScanner.resume();
                    
                    isProcessingScan = false; // SYSTEM UNLOCK FOR NEXT SCAN
                }, ms);
            };

            window.clearLogs = function() {
                if(confirm("Warning! Data aur Barcode ki memory sab delete kar de?")) {
                    appData = { calendar: {}, logs: [], barcodeMap: {} };
                    localStorage.setItem('smartTrackerDataFINAL3', JSON.stringify(appData));
                    renderCalendar();
                    renderLogs();
                }
            };

            window.downloadPDF = function() {
                const element = document.getElementById('main-content');
                document.getElementById('reader').style.display = 'none'; 
                html2pdf().set({ margin: 0.5, filename: `Track-Report-${currentDateStr}.pdf`, jsPDF: { format: 'a4' }})
                .from(element).save().then(() => { document.getElementById('reader').style.display = 'block'; });
            };

            // Start 
            renderCalendar();
            renderLogs();
            try {
                html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: {width: 250, height: 150}, rememberLastUsedCamera: true }, false);
                html5QrcodeScanner.render(onScanSuccess);
            } catch (err) {}
        });
    </script>
</body>
</html>
