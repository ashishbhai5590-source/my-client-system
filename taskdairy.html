<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Study Task Challenge</title>

  <style>
    /* ─────────────────────────────────────────────────────────
       COLORFUL, BRIGHT & ENERGETIC THEME (NO DARK MODE)
       ───────────────────────────────────────────────────────── */
    :root {
      --primary: #6366f1;
      --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      --accent-coral: #ff6b6b;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-blue: #0284c7;

      --card-bg: rgba(255, 255, 255, 0.88);
      --card-border: rgba(255, 255, 255, 0.9);
      --shadow-soft: 0 10px 25px -5px rgba(99, 102, 241, 0.12), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      --shadow-elevated: 0 20px 35px -8px rgba(99, 102, 241, 0.2);

      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;

      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      --radius-sm: 12px;
      --radius-md: 18px;
      --radius-lg: 26px;
      --radius-pill: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: var(--font-family);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 90px;
      /* Vibrant candy gradient background */
      background: linear-gradient(135deg, #fdf4ff 0%, #ede9fe 25%, #e0f2fe 55%, #fef3c7 85%, #ffe4e6 100%);
      background-attachment: fixed;
    }

    input, select {
      user-select: text;
    }

    /* ─────────────────────────────────────────────────────────
       HEADER & STATS STRIP
       ───────────────────────────────────────────────────────── */
    header.app-header {
      padding: 22px 20px 14px 20px;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.8);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #4f46e5 0%, #db2777 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-pills {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      background: #ffffff;
      border: 1px solid rgba(99, 102, 241, 0.2);
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.1);
    }

    /* ─────────────────────────────────────────────────────────
       NOTIFICATION TEST BANNER
       ───────────────────────────────────────────────────────── */
    .notif-banner {
      margin: 14px 16px 6px 16px;
      background: linear-gradient(135deg, #ffffff 0%, #fdf2f8 100%);
      border: 1px solid #fbcfe8;
      border-radius: var(--radius-md);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-soft);
      gap: 8px;
    }

    .notif-banner-info {
      font-size: 0.8rem;
      color: #831843;
      font-weight: 600;
      line-height: 1.3;
    }

    .btn-test-notif {
      background: linear-gradient(135deg, #ec4899 0%, #f43f5e 100%);
      color: #ffffff;
      border: none;
      padding: 7px 12px;
      border-radius: var(--radius-pill);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
    }

    .btn-test-notif:active {
      transform: scale(0.96);
    }

    /* ─────────────────────────────────────────────────────────
       MAIN CONTAINER
       ───────────────────────────────────────────────────────── */
    .main-container {
      padding: 12px 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text-main);
      margin: 10px 0 12px 2px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* ─────────────────────────────────────────────────────────
       TASK CARDS
       ───────────────────────────────────────────────────────── */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s;
    }

    .task-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 5px;
      background: var(--card-accent, #6366f1);
    }

    .task-card.status-active-card::before { background: #3b82f6; }
    .task-card.status-completed-card::before { background: #10b981; }
    .task-card.status-rejected-card::before { background: #ef4444; }

    .task-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .subject-pill {
      font-size: 0.78rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      background: #f1f5f9;
      color: #334155;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .task-status-tag {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 8px;
      letter-spacing: 0.03em;
    }

    .tag-upcoming { background: #f1f5f9; color: #64748b; }
    .tag-active { background: #dbeafe; color: #1d4ed8; }
    .tag-completed { background: #dcfce7; color: #15803d; }
    .tag-rejected { background: #fee2e2; color: #b91c1c; }

    .task-topic {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.3;
    }

    .task-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 4px;
      padding-top: 8px;
      border-top: 1px solid rgba(0, 0, 0, 0.04);
    }

    .btn-retry {
      background: #fee2e2;
      color: #dc2626;
      border: 1px solid #fca5a5;
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .empty-state {
      background: rgba(255, 255, 255, 0.7);
      border: 2px dashed rgba(99, 102, 241, 0.25);
      border-radius: var(--radius-lg);
      padding: 36px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    /* ─────────────────────────────────────────────────────────
       ACTIVE TIMER VIEW
       ───────────────────────────────────────────────────────── */
    .timer-screen-card {
      background: #ffffff;
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: var(--radius-lg);
      padding: 32px 20px;
      text-align: center;
      box-shadow: var(--shadow-elevated);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .timer-topic-title {
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--text-main);
      margin-top: 8px;
    }

    .timer-time-frame {
      font-size: 0.85rem;
      font-weight: 700;
      color: #6366f1;
      background: #eef2ff;
      padding: 4px 14px;
      border-radius: var(--radius-pill);
      margin: 8px 0 24px 0;
    }

    .timer-display-box {
      font-size: 4.6rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: #1e1b4b;
      line-height: 1;
      margin-bottom: 28px;
      text-shadow: 0 4px 18px rgba(99, 102, 241, 0.2);
    }

    .timer-button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }

    .btn-pause {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
      padding: 14px;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-finish {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
    }

    /* ─────────────────────────────────────────────────────────
       MODAL & POPUP CHALLENGE (ARE YOU READY?)
       ───────────────────────────────────────────────────────── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease-out;
    }

    .modal-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }

    .challenge-card {
      background: #ffffff;
      border: 2px solid #818cf8;
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 350px;
      padding: 26px 20px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(99, 102, 241, 0.35);
      transform: scale(0.92);
      transition: transform 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    .modal-backdrop.show .challenge-card {
      transform: scale(1);
    }

    .challenge-alert-tag {
      font-size: 0.82rem;
      font-weight: 900;
      color: #4f46e5;
      background: #eef2ff;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      display: inline-block;
      margin-bottom: 12px;
    }

    .challenge-subject-name {
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--text-main);
    }

    .challenge-topic-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: #64748b;
      margin: 6px 0 12px 0;
    }

    .challenge-time-tag {
      font-size: 0.85rem;
      font-weight: 800;
      color: #b45309;
      background: #fef3c7;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      display: inline-block;
      margin-bottom: 22px;
    }

    .challenge-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-accept {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: #ffffff;
      border: none;
      padding: 15px;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
    }

    .btn-reject {
      background: #f8fafc;
      color: #dc2626;
      border: 1px solid #fecaca;
      padding: 12px;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* ─────────────────────────────────────────────────────────
       ADD TASK FORM DRAWER / SHEET
       ───────────────────────────────────────────────────────── */
    .form-sheet {
      background: #ffffff;
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 400px;
      padding: 24px;
      box-shadow: var(--shadow-elevated);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 800;
      color: #475569;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .form-input, .form-select {
      width: 100%;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #1e293b;
      outline: none;
      font-family: inherit;
    }

    .form-input:focus, .form-select:focus {
      border-color: #6366f1;
      background: #ffffff;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-create-task {
      width: 100%;
      background: linear-gradient(135deg, #4f46e5 0%, #db2777 100%);
      color: #ffffff;
      border: none;
      padding: 15px;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.3);
    }

    /* ─────────────────────────────────────────────────────────
       FLOATING ADD BUTTON & BOTTOM NAV
       ───────────────────────────────────────────────────────── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-btn {
      background: transparent;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: #94a3b8;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
    }

    .nav-btn .icon {
      font-size: 1.3rem;
    }

    .nav-btn.active {
      color: #4f46e5;
    }

    .floating-add-btn {
      position: fixed;
      bottom: 82px;
      right: 20px;
      background: linear-gradient(135deg, #4f46e5 0%, #db2777 100%);
      color: #ffffff;
      border: none;
      padding: 14px 22px;
      border-radius: var(--radius-pill);
      font-size: 0.95rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 25px rgba(219, 39, 119, 0.35);
      cursor: pointer;
      z-index: 90;
    }

    .floating-add-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-top">
      <div class="brand-title">
        <span>⚡</span> Study Challenge
      </div>
      <div class="header-pills">
        <span class="header-badge" id="todayDateLabel">Today</span>
        <span class="header-badge" id="taskStatsPill">0 Tasks</span>
      </div>
    </div>
  </header>

  <!-- Notification Test Ribbon -->
  <div class="notif-banner">
    <div class="notif-banner-info">
      🔔 <strong>बैकग्राउंड टेस्ट करें:</strong> बटन दबाकर होम जाएं और रील चलाएं!
    </div>
    <button class="btn-test-notif" onclick="scheduleTestAlert()">⚡ Test (5s)</button>
  </div>

  <!-- MAIN VIEW CONTAINER -->
  <main class="main-container">
    
    <!-- 1. TASKS TAB (Default) -->
    <div id="tab-tasks">
      <div class="section-title">
        <span>🎯 Today's Study Tasks</span>
      </div>
      <div class="task-list" id="taskListContainer">
        <!-- Rendered by JS -->
      </div>
    </div>

    <!-- 2. ACTIVE TIMER TAB -->
    <div id="tab-timer" style="display: none;">
      <div class="timer-screen-card" id="timerScreenCard">
        <!-- Rendered by JS -->
      </div>
    </div>

  </main>

  <!-- Floating Add Task Button -->
  <button class="floating-add-btn" id="floatingAddBtn" onclick="openAddTaskModal()">
    <span>➕</span> Add Task
  </button>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-btn active" id="navBtnTasks" onclick="switchTab('tasks')">
      <span class="icon">📚</span>
      <span>Tasks</span>
    </button>
    <button class="nav-btn" id="navBtnTimer" onclick="switchTab('timer')">
      <span class="icon">⏱️</span>
      <span>Active Timer</span>
    </button>
  </nav>

  <!-- MODAL: ADD TASK -->
  <div class="modal-backdrop" id="addTaskModal">
    <div class="form-sheet">
      <h3 style="font-size: 1.25rem; font-weight: 900; margin-bottom: 16px; color: #1e1b4b;">✨ New Study Task</h3>
      
      <form onsubmit="handleCreateTask(event)">
        <div class="form-group">
          <label class="form-label">Subject</label>
          <select class="form-select" id="formSubject" onchange="toggleCustomSubject(this)">
            <option value="📘 Biology">📘 Biology</option>
            <option value="⚗️ Chemistry">⚗️ Chemistry</option>
            <option value="📐 Mathematics">📐 Mathematics</option>
            <option value="⚡ Physics">⚡ Physics</option>
            <option value="📚 English">📚 English</option>
            <option value="📙 Hindi">📙 Hindi</option>
            <option value="CUSTOM">✏️ Custom Subject...</option>
          </select>
        </div>

        <div class="form-group" id="customSubjectWrap" style="display: none;">
          <label class="form-label">Custom Subject Name</label>
          <input type="text" class="form-input" id="formCustomSubject" placeholder="e.g. History" />
        </div>

        <div class="form-group">
          <label class="form-label">Topic Name</label>
          <input type="text" class="form-input" id="formTopic" placeholder="e.g. Amines Revision" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Start Time</label>
            <input type="time" class="form-input" id="formStartTime" required />
          </div>
          <div class="form-group">
            <label class="form-label">End Time</label>
            <input type="time" class="form-input" id="formEndTime" required />
          </div>
        </div>

        <div style="display: flex; gap: 8px; margin-top: 14px;">
          <button type="button" class="form-input" style="width: 35%; cursor: pointer;" onclick="closeAddTaskModal()">Cancel</button>
          <button type="submit" class="btn-create-task" style="width: 65%;">Set Challenge</button>
        </div>
      </form>
    </div>
  </div>

  <!-- POPUP MODAL: CHALLENGE POPUP -->
  <div class="modal-backdrop" id="challengeModal">
    <div class="challenge-card">
      <div class="challenge-alert-tag">🔔 TIME'S UP! CHALLENGE READY</div>
      <div class="challenge-subject-name" id="popSubject">📘 Biology</div>
      <div class="challenge-topic-name" id="popTopic">Human Reproduction</div>
      <div class="challenge-time-tag" id="popTimeRange">7:00 PM — 8:00 PM</div>

      <div style="font-size: 0.95rem; font-weight: 700; color: #1e1b4b; margin-bottom: 18px;">
        Are you ready to study now?
      </div>

      <div class="challenge-buttons">
        <button class="btn-accept" onclick="acceptStudyChallenge()">🚀 ACCEPT CHALLENGE</button>
        <button class="btn-reject" onclick="rejectStudyChallenge()">❌ REJECT</button>
      </div>
    </div>
  </div>

  <!-- ─────────────────────────────────────────────────────────
       JAVASCRIPT APPLICATION ENGINE
       ───────────────────────────────────────────────────────── */
  -->
  <script>
    /* =========================================================
       1. SYNTHESIZED SOUNDS (WEB AUDIO API)
       ========================================================= */
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playTone(freq, dur, type = 'sine', delay = 0) {
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime + delay);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + delay + dur);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + delay);
          osc.stop(this.ctx.currentTime + delay + dur);
        } catch(e) {}
      }
      playChime() {
        this.playTone(587.33, 0.2, 'sine', 0);
        this.playTone(880.00, 0.45, 'triangle', 0.1);
      }
      playAccept() {
        this.playTone(523.25, 0.15, 'sine', 0);
        this.playTone(659.25, 0.25, 'triangle', 0.1);
      }
      playComplete() {
        this.playTone(523.25, 0.15, 'sine', 0);
        this.playTone(659.25, 0.15, 'sine', 0.1);
        this.playTone(783.99, 0.15, 'sine', 0.2);
        this.playTone(1046.50, 0.5, 'triangle', 0.3);
      }
      playReject() {
        this.playTone(260, 0.15, 'triangle', 0);
        this.playTone(200, 0.25, 'triangle', 0.1);
      }
    }
    const audio = new SoundEngine();

    /* =========================================================
       2. STATE & STORAGE
       ========================================================= */
    const STORAGE_KEY = 'study_colorful_tasks_v1';
    let appState = {
      tasks: [],
      activeChallenge: null // { taskId, targetEndMs, originalMins, isPaused, pausedRemainingMs }
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) appState = Object.assign(appState, JSON.parse(raw));
      } catch (e) {}
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {}
    }

    /* =========================================================
       3. NOTIFICATION DISPATCHER & TESTER
       ========================================================= */
    async function ensureNotificationPermission() {
      if ('Notification' in window && Notification.permission !== 'granted') {
        await Notification.requestPermission();
      }
    }

    function sendSystemNotification(title, body) {
      if ('Notification' in window && Notification.permission === 'granted') {
        try {
          const n = new Notification(title, {
            body: body,
            icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="75" font-size="75">🔔</text></svg>'
          });
          n.onclick = () => {
            window.focus();
          };
        } catch(e) {}
      }
    }

    // Test 5 second timer to let user switch to Instagram Reels
    function scheduleTestAlert() {
      audio.init();
      ensureNotificationPermission();
      alert("5 सेकंड का टाइमर शुरू हो गया है!\n\nअभी तुरंत होम बटन दबाकर रील्स या दूसरा ऐप खोल लीजिए। 5 सेकंड में ऊपर नोटिफिकेशन आएगा!");
      setTimeout(() => {
        sendSystemNotification("🔔 Study Challenge Ready!", "Test: आपकी पढ़ाई का समय हो गया है! ऐप खोलें।");
        audio.playChime();
      }, 5000);
    }

    /* =========================================================
       4. TIME HELPERS
       ========================================================= */
    function formatTime12(time24) {
      if (!time24) return '';
      const [h, m] = time24.split(':').map(Number);
      const ampm = h >= 12 ? 'PM' : 'AM';
      const h12 = h % 12 || 12;
      return `${h12}:${String(m).padStart(2, '0')} ${ampm}`;
    }

    function parseTodayTimestamp(time24) {
      const [hours, minutes] = time24.split(':').map(Number);
      const d = new Date();
      d.setHours(hours, minutes, 0, 0);
      return d.getTime();
    }

    function getMinutesBetween(startTime24, endTime24) {
      const s = parseTodayTimestamp(startTime24);
      let e = parseTodayTimestamp(endTime24);
      if (e <= s) e += 24 * 60 * 60 * 1000;
      return Math.round((e - s) / 60000);
    }

    /* =========================================================
       5. TASK MONITOR & CHALLENGE TRIGGER
       ========================================================= */
    let currentTriggeredTask = null;

    function checkScheduledTasks() {
      const now = Date.now();
      appState.tasks.forEach(task => {
        if (task.status === 'UPCOMING') {
          const startMs = parseTodayTimestamp(task.startTime);
          // If start time arrived within a 4-hour window
          if (now >= startMs && (now - startMs) < 4 * 60 * 60 * 1000) {
            triggerChallengePopup(task.id);
          }
        }
      });
    }

    function triggerChallengePopup(taskId) {
      const task = appState.tasks.find(t => t.id === taskId);
      if (!task || task.status === 'ACTIVE' || task.status === 'COMPLETED') return;

      currentTriggeredTask = task;
      document.getElementById('popSubject').textContent = task.subject;
      document.getElementById('popTopic').textContent = task.topic;
      document.getElementById('popTimeRange').textContent = `${formatTime12(task.startTime)} — ${formatTime12(task.endTime)}`;

      audio.playChime();
      sendSystemNotification("🔔 Study Time!", `${task.subject} — ${task.topic}\nYour study challenge is ready.`);

      document.getElementById('challengeModal').classList.add('show');
    }

    function acceptStudyChallenge() {
      if (!currentTriggeredTask) return;
      const task = currentTriggeredTask;

      document.getElementById('challengeModal').classList.remove('show');
      task.status = 'ACTIVE';

      const durationMins = getMinutesBetween(task.startTime, task.endTime);
      appState.activeChallenge = {
        taskId: task.id,
        targetEndMs: Date.now() + durationMins * 60 * 1000,
        originalMins: durationMins,
        isPaused: false,
        pausedRemainingMs: null
      };

      saveState();
      renderTasks();
      audio.playAccept();
      switchTab('timer');
    }

    function rejectStudyChallenge() {
      if (!currentTriggeredTask) return;
      currentTriggeredTask.status = 'REJECTED';
      document.getElementById('challengeModal').classList.remove('show');
      saveState();
      renderTasks();
      audio.playReject();
      currentTriggeredTask = null;
    }

    function retryTask(taskId) {
      const task = appState.tasks.find(t => t.id === taskId);
      if (task) {
        task.status = 'UPCOMING';
        saveState();
        renderTasks();
        triggerChallengePopup(taskId);
      }
    }

    /* =========================================================
       6. ACTIVE COUNTDOWN TIMER
       ========================================================= */
    let timerLoop = null;

    function startTimerTick() {
      if (timerLoop) clearInterval(timerLoop);
      timerLoop = setInterval(() => {
        if (!appState.activeChallenge) {
          renderTimerView();
          return;
        }

        const active = appState.activeChallenge;
        if (active.isPaused) {
          renderTimerView();
          return;
        }

        const remainingMs = active.targetEndMs - Date.now();
        if (remainingMs <= 0) {
          finishActiveStudy();
        } else {
          renderTimerView();
        }
      }, 500);
    }

    function renderTimerView() {
      const container = document.getElementById('timerScreenCard');
      if (!appState.activeChallenge) {
        container.innerHTML = `
          <div style="font-size: 3rem; margin-bottom: 8px;">⏳</div>
          <div style="font-size: 1.1rem; font-weight: 800; color: #334155;">No Active Challenge</div>
          <div style="font-size: 0.85rem; color: #64748b; margin-top: 4px;">Accept a task from the list to start your countdown!</div>
        `;
        return;
      }

      const active = appState.activeChallenge;
      const task = appState.tasks.find(t => t.id === active.taskId);
      if (!task) {
        appState.activeChallenge = null;
        saveState();
        return;
      }

      const remainingMs = active.isPaused 
        ? active.pausedRemainingMs 
        : Math.max(0, active.targetEndMs - Date.now());

      const totalSec = Math.floor(remainingMs / 1000);
      const mins = Math.floor(totalSec / 60);
      const secs = totalSec % 60;
      const timeStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

      container.innerHTML = `
        <span class="subject-pill">${task.subject}</span>
        <div class="timer-topic-title">${escapeHtml(task.topic)}</div>
        <div class="timer-time-frame">${formatTime12(task.startTime)} — ${formatTime12(task.endTime)}</div>
        <div class="timer-display-box">${timeStr}</div>
        <div class="timer-button-row">
          <button class="btn-pause" onclick="togglePauseTimer()">
            ${active.isPaused ? '▶ Resume' : '⏸ Pause'}
          </button>
          <button class="btn-finish" onclick="finishActiveStudy()">
            ✓ Complete
          </button>
        </div>
      `;
    }

    function togglePauseTimer() {
      if (!appState.activeChallenge) return;
      const active = appState.activeChallenge;
      if (active.isPaused) {
        active.targetEndMs = Date.now() + active.pausedRemainingMs;
        active.isPaused = false;
        active.pausedRemainingMs = null;
      } else {
        active.pausedRemainingMs = Math.max(0, active.targetEndMs - Date.now());
        active.isPaused = true;
      }
      saveState();
      renderTimerView();
    }

    function finishActiveStudy() {
      if (!appState.activeChallenge) return;
      const task = appState.tasks.find(t => t.id === appState.activeChallenge.taskId);
      if (task) task.status = 'COMPLETED';

      appState.activeChallenge = null;
      saveState();
      renderTasks();
      renderTimerView();
      audio.playComplete();
      alert("✨ बधाई हो! आपने अपना स्टडी चैलेंज पूरा कर लिया!");
      switchTab('tasks');
    }

    /* =========================================================
       7. TASK RENDERING & CREATION
       ========================================================= */
    function renderTasks() {
      const container = document.getElementById('taskListContainer');
      const statsPill = document.getElementById('taskStatsPill');
      statsPill.textContent = `${appState.tasks.length} Tasks`;

      if (appState.tasks.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div style="font-size: 2.5rem; margin-bottom: 8px;">🎯</div>
            <div style="font-weight: 800; font-size: 1.05rem; color: #1e1b4b;">No Study Tasks Added</div>
            <div style="font-size: 0.85rem; margin-top: 4px;">Click '+ Add Task' below to plan your study session.</div>
          </div>
        `;
        return;
      }

      appState.tasks.sort((a, b) => a.startTime.localeCompare(b.startTime));

      container.innerHTML = appState.tasks.map(task => {
        let tagClass = 'tag-upcoming';
        let statusLabel = '⏳ UPCOMING';
        let cardClass = '';
        let retryBtn = '';

        if (task.status === 'ACTIVE') {
          tagClass = 'tag-active';
          statusLabel = '🔵 ACTIVE';
          cardClass = 'status-active-card';
        } else if (task.status === 'COMPLETED') {
          tagClass = 'tag-completed';
          statusLabel = '🟢 COMPLETED';
          cardClass = 'status-completed-card';
        } else if (task.status === 'REJECTED') {
          tagClass = 'tag-rejected';
          statusLabel = '🔴 REJECTED';
          cardClass = 'status-rejected-card';
          retryBtn = `<button class="btn-retry" onclick="retryTask('${task.id}')">↻ Try Again</button>`;
        }

        return `
          <div class="task-card ${cardClass}">
            <div class="task-card-header">
              <span class="subject-pill">${escapeHtml(task.subject)}</span>
              <span class="task-status-tag ${tagClass}">${statusLabel}</span>
            </div>
            <div class="task-topic">${escapeHtml(task.topic)}</div>
            <div class="task-card-footer">
              <span>⏰ ${formatTime12(task.startTime)} — ${formatTime12(task.endTime)}</span>
              ${retryBtn}
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleCustomSubject(sel) {
      const wrap = document.getElementById('customSubjectWrap');
      wrap.style.display = sel.value === 'CUSTOM' ? 'block' : 'none';
      if (sel.value === 'CUSTOM') document.getElementById('formCustomSubject').focus();
    }

    function openAddTaskModal() {
      audio.init();
      ensureNotificationPermission();
      document.getElementById('addTaskModal').classList.add('show');
    }

    function closeAddTaskModal() {
      document.getElementById('addTaskModal').classList.remove('show');
    }

    function handleCreateTask(e) {
      e.preventDefault();
      let subject = document.getElementById('formSubject').value;
      if (subject === 'CUSTOM') {
        const custom = document.getElementById('formCustomSubject').value.trim();
        subject = custom ? `📖 ${custom}` : '📖 Study';
      }

      const topic = document.getElementById('formTopic').value.trim();
      const startTime = document.getElementById('formStartTime').value;
      const endTime = document.getElementById('formEndTime').value;

      if (!topic || !startTime || !endTime) return;

      appState.tasks.push({
        id: 'task_' + Date.now(),
        subject,
        topic,
        startTime,
        endTime,
        status: 'UPCOMING'
      });

      saveState();
      closeAddTaskModal();
      renderTasks();
      checkScheduledTasks();
    }

    /* =========================================================
       8. TAB NAVIGATION
       ========================================================= */
    function switchTab(tab) {
      const tabTasks = document.getElementById('tab-tasks');
      const tabTimer = document.getElementById('tab-timer');
      const btnTasks = document.getElementById('navBtnTasks');
      const btnTimer = document.getElementById('navBtnTimer');
      const floatBtn = document.getElementById('floatingAddBtn');

      if (tab === 'tasks') {
        tabTasks.style.display = 'block';
        tabTimer.style.display = 'none';
        btnTasks.classList.add('active');
        btnTimer.classList.remove('active');
        floatBtn.style.display = 'flex';
        renderTasks();
      } else {
        tabTasks.style.display = 'none';
        tabTimer.style.display = 'block';
        btnTasks.classList.remove('active');
        btnTimer.classList.add('active');
        floatBtn.style.display = 'none';
        renderTimerView();
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* =========================================================
       9. INITIALIZATION & BACKGROUND WAKEUP
       ========================================================= */
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      document.getElementById('todayDateLabel').textContent = new Date().toLocaleDateString('en-US', {
        weekday: 'short', month: 'short', day: 'numeric'
      });

      renderTasks();
      startTimerTick();

      if (appState.activeChallenge) switchTab('timer');

      // Schedule check every 4 seconds
      setInterval(checkScheduledTasks, 4000);

      // Instant check as soon as you come back from Reels
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          checkScheduledTasks();
          renderTimerView();
        }
      });
      window.addEventListener('focus', () => {
        checkScheduledTasks();
        renderTimerView();
      });
    });
  </script>
</body>
